; ============================================================================
; AegiSheet report definition
; ============================================================================
;
; This file describes WHAT to report on. Values under [global] can also be
; supplied as environment variables (AEGISHEET_*) or command line flags, which
; take precedence in that order; see `aegisheet -h` and `aegisheet -print-config`.
;
; Each remaining section becomes one worksheet:
;   - the section name is the worksheet title (normalised to Excel's rules)
;   - `task=` selects which report to run; `aegisheet -list-tasks` lists them
;   - a section with no `task=` key is skipped with a warning
;
; Keys are case-insensitive (userKey, userkey and USERKEY are the same key).
; Values in <angle brackets> are treated as unset placeholders.

[global]

; --- Authentication -------------------------------------------------------
; Pick exactly one of the three modes.
;
; 1. Service account with domain-wide delegation. The right choice for
;    scheduled, unattended runs: no browser, no terminal, no cached token.
;    Requires impersonateSubject, because the Admin SDK rejects service account
;    calls that do not act as a real administrator.
;serviceAccountFile=/etc/aegisheet/service-account.json
;impersonateSubject=workspace-admin@example.com
;
; 2. Installed application OAuth. Prompts once on the terminal, then reuses the
;    cached token. Keep both files readable only by their owner (chmod 600).
credentialsFile=<path_to_credentials>
tokenFile=<path_to_token>
;
; 3. Application Default Credentials, for use inside Google Cloud.
;useADC=true
;
; Refuse to prompt on the terminal. Set this for cron and CI so a missing token
; fails loudly instead of blocking forever on a read from standard input.
;nonInteractive=true
;
; Override the built-in least-privilege scope set. Deleting the token file is
; required after changing this, because a cached token carries its old scopes.
;scopes=https://www.googleapis.com/auth/admin.directory.user.readonly,https://www.googleapis.com/auth/admin.directory.group.readonly

; --- Output ---------------------------------------------------------------
; The workbook contains directory data about real people. It is written
; atomically and, by default, readable only by its owner.
output=<path_to_output>
;outputMode=0600
;overwrite=true

; --- Tenant ---------------------------------------------------------------
; my_customer means "the tenant the credentials belong to". Set domain instead
; to restrict the reports to a single domain; the API accepts only one of the two.
;customer=my_customer
;domain=example.com

; --- API behaviour --------------------------------------------------------
;httpTimeout=60s        ; per HTTP request
;maxRetries=4           ; extra attempts after a retryable failure (429/403 rate limit/5xx)
;retryBaseDelay=500ms
;retryMaxDelay=30s
;pageSize=200           ; clamped to each API's own maximum
;concurrency=4          ; parallel per-user calls in the fan-out reports

; --- Execution ------------------------------------------------------------
;timeout=15m            ; wall-clock budget for the whole run; 0 disables it
;failFast=false         ; true stops at the first failing section
;only=                  ; comma separated section or task names to run
;skip=                  ; comma separated section or task names to exclude

; --- Logging --------------------------------------------------------------
;logLevel=info          ; debug, info, warn, error
;logFormat=text         ; text for humans, json for log collectors
;logFile=stderr         ; stderr, stdout, or a path to append to
;logSource=false        ; annotate records with source file and line
;logPII=false           ; log personal data unmasked (short debugging sessions only)

; Addresses excluded from the user reports, for accounts that legitimately
; cannot enrol in 2-step verification. A section may override this with its own
; whitelist= key. Matching ignores case.
;whitelist=svc-backup@example.com,svc-scanner@example.com


; ============================================================================
; Report sections
; ============================================================================

[Group Members]
task=GetGroupMembers

[Groups]
task=GetGroups

[2nd Factor Users]
task=GetUsersWithout2Fa
;whitelist=svc-backup@example.com

[Admins]
task=GetAdmins

[Suspended Users]
task=GetSuspendedUsers
enabled=false

[Admin Activity]
task=GetAuditLogins
; Valid values include: login, admin, drive, token, mobile, groups, calendar,
; chat, meet, saml, chrome, user_accounts. An unlisted value is passed through
; with a warning, because Google publishes new applications regularly.
appname=drive
; Subject to report on; "all" (the default) covers the whole tenant.
;userKey=all
; Narrow to one event type, e.g. login_failure.
;eventName=
; Time window. lookbackDays is relative to the run; startTime/endTime accept
; 2006-01-02 or full RFC 3339 and take precedence over lookbackDays.
lookbackDays=30
;startTime=2026-01-01
;endTime=2026-02-01T00:00:00Z
; Safety valve for interactive runs against a busy tenant.
;maxRows=50000

[Third Party Tokens]
task=GetTokensThirdPartyApps
; Omit userKey to sweep every user in the tenant.
;userKey=admin@example.com
enabled=false

[App Passwords]
task=GetAsps
enabled=false
