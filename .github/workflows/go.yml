name: Go

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Individual jobs widen this only where they must.
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool versions live here so that all jobs move together and a bump is one edit.
  # The vulnerability database is always fetched fresh at run time; only the
  # scanner binary is pinned.
  GOLANGCI_LINT_VERSION: v2.12.2
  GOSEC_VERSION: v2.28.0
  GOVULNCHECK_VERSION: v1.6.0

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from go.mod so the toolchain cannot drift from what
          # the module declares.
          go-version-file: go.mod
          cache: true

      - name: Verify the module graph is tidy and unmodified
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

      - name: Build
        run: go build -trimpath ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The configuration lives in .golangci.yml, so the same rules apply here and
      # on a developer's machine via `make lint`.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to publish the gosec findings to the repository's Security tab.
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck compares the packages this module actually calls against the
      # Go vulnerability database. It reports advisories for modules that are only
      # required transitively as informational and exits non-zero only when
      # vulnerable code is genuinely reachable from this binary.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          gosec -fmt=sarif -out=gosec.sarif -stdout -verbose=text ./...

      # Publishing to the Security tab needs GitHub Advanced Security, which is
      # not enabled on every private repository. The scan above already fails the
      # job on a finding, so a rejected upload must not turn a clean scan red.
      - name: Publish the gosec findings
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The reports are generated from workstations and from schedulers on
        # several platforms; a compile break on any of them should fail here.
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/aegisheet
